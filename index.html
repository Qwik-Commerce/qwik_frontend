<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qwik.ng – Nigeria's Trusted Online Marketplace</title>
    <meta
      name="description"
      content="Buy, sell, and discover new and used items across Nigeria. Post ads for free and connect with buyers nationwide on Qwik."
    />
    <meta
      name="keywords"
      content="Qwik.ng, Nigeria marketplace, buy and sell Nigeria, online marketplace, classified ads Nigeria, cars, electronics, properties, jobs"
    />

    <meta property="og:title" content="Qwik.ng – Nigeria's Trusted Online Marketplace" />
    <meta
      property="og:description"
      content="Buy, sell, and discover new and used items across Nigeria. Post ads for free and connect with buyers nationwide on Qwik."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.qwik.ng" />
    <meta property="og:image" content="https://www.qwik.ng/images/logo-header.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Qwik.ng – Nigeria's Trusted Online Marketplace" />
    <meta
      name="twitter:description"
      content="Buy, sell, and discover new and used items across Nigeria. Post ads for free and connect with buyers nationwide on Qwik."
    />
    <meta name="twitter:image" content="https://www.qwik.ng/images/logo-header.png" />

    <link rel="icon" type="image/png" href="/images/logo-header.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Qwik",
        "url": "https://www.qwik.ng",
        "logo": "https://www.qwik.ng/images/logo-header.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Qwik.ng",
        "url": "https://www.qwik.ng",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.qwik.ng/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
